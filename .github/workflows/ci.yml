name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  dotnet:
    name: Server and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # The projects reference the sources of Routeables, checked out next to this repository (RouteablesRoot, ../Routeables by default).
      - name: Checkout Routeables.SignalR
        uses: actions/checkout@v4
        with:
          path: Routeables.SignalR

      - name: Checkout Routeables
        uses: actions/checkout@v4
        with:
          repository: cedric56/Routeables
          path: Routeables

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Routeables.SignalR.slnx -c ${{ env.CONFIGURATION }} -p:CiBuild=true
        working-directory: Routeables.SignalR

      - name: Sessions, hub and targets
        run: dotnet test --project tests/Routeables.SignalR.Test/Routeables.SignalR.Test.csproj --no-build -c ${{ env.CONFIGURATION }}
        working-directory: Routeables.SignalR

      # The server of the Angular sample, driven the way the Angular application drives it.
      - name: Angular sample server
        run: dotnet test --project tests/Routeables.SignalR.Test.Angular/Routeables.SignalR.Test.Angular.csproj --no-build -c ${{ env.CONFIGURATION }}
        working-directory: Routeables.SignalR

  ts-client:
    name: TypeScript client
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: clients/typescript

      - name: Test
        run: npm test
        working-directory: clients/typescript

  # The Vue sample draws the view models of the Angular sample server: its types and its build are checked here.
  vue-sample:
    name: Vue sample
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: samples/Vue/XAnimals.Vue

      - name: Build
        run: npm run build
        working-directory: samples/Vue/XAnimals.Vue
