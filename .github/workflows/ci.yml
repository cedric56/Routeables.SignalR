name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      routeables-ref:
        description: The commit, tag or branch of Routeables to build against (the pinned one by default).
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  # The revision of Routeables this repository is built and tested against. Move it on purpose, in its own commit:
  # a change of Routeables never breaks this build by surprise.
  ROUTEABLES_REF: ${{ github.event.inputs.routeables-ref || '649af26d6776733749c25751a6b61892fc310559' }}

jobs:
  dotnet:
    name: Server and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # The projects reference the sources of Routeables, checked out next to this repository (RouteablesRoot, ../Routeables by default).
      - name: Checkout Routeables.SignalR
        uses: actions/checkout@v7
        with:
          path: Routeables.SignalR

      - name: Checkout Routeables
        uses: actions/checkout@v7
        with:
          repository: cedric56/Routeables
          ref: ${{ env.ROUTEABLES_REF }}
          path: Routeables

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Routeables.SignalR.slnx -c ${{ env.CONFIGURATION }} -p:CiBuild=true
        working-directory: Routeables.SignalR

      - name: Sessions, hub, targets, security, protocol and reconnection
        run: dotnet test --project tests/Routeables.SignalR.Test/Routeables.SignalR.Test.csproj --no-build -c ${{ env.CONFIGURATION }}
        working-directory: Routeables.SignalR

      # The Routeables Remote Protocol: convergence, failures, admission, text, the shared fixture of the clients.
      - name: Remote protocol
        run: dotnet test --project tests/Routeables.Remote.Test/Routeables.Remote.Test.csproj --no-build -c ${{ env.CONFIGURATION }}
        working-directory: Routeables.SignalR

      # The server of the samples, driven the way an application drives it.
      - name: Sample server
        run: dotnet test --project tests/Routeables.SignalR.Test.Angular/Routeables.SignalR.Test.Angular.csproj --no-build -c ${{ env.CONFIGURATION }}
        working-directory: Routeables.SignalR

      - name: Pack (sources of Routeables)
        run: |
          dotnet pack src/Routeables.Remote/Routeables.Remote.csproj --no-build -c ${{ env.CONFIGURATION }} -o ../artifacts
          dotnet pack src/Routeables.SignalR/Routeables.SignalR.csproj --no-build -c ${{ env.CONFIGURATION }} -o ../artifacts
          dotnet pack src/Routeables.SignalR.Essentials/Routeables.SignalR.Essentials.csproj --no-build -c ${{ env.CONFIGURATION }} -o ../artifacts
        working-directory: Routeables.SignalR

  ts-client:
    name: TypeScript client
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: clients/typescript

      - name: Test
        run: npm test
        working-directory: clients/typescript

      # The package as it would be published: packed, installed in an empty project, imported.
      - name: Install the package
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/routeables-client-*.tgz @microsoft/signalr
          node --input-type=module -e "import { RouteablesClient, signalRTransport, PROTOCOL } from '@routeables/client'; if (typeof RouteablesClient !== 'function' || typeof signalRTransport !== 'function' || PROTOCOL !== 2) process.exit(1);"
        working-directory: clients/typescript

  # A real Kestrel server and real SignalR, driven by the client from Node: the order of the calls of a connection, the reconnection.
  end-to-end:
    name: End to end over SignalR
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Routeables.SignalR
        uses: actions/checkout@v7
        with:
          path: Routeables.SignalR

      - name: Checkout Routeables
        uses: actions/checkout@v7
        with:
          repository: cedric56/Routeables
          ref: ${{ env.ROUTEABLES_REF }}
          path: Routeables

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the server
        run: dotnet build tests/Routeables.SignalR.E2E.Server/Routeables.SignalR.E2E.Server.csproj -c ${{ env.CONFIGURATION }}
        working-directory: Routeables.SignalR

      - name: Build the client
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: Routeables.SignalR/clients/typescript

      # The sessions (e2e.test.mjs), and the replication: the TypeScript replica against the .NET server (replication.test.mjs).
      - name: Test
        run: node --test tests/e2e/e2e.test.mjs tests/e2e/replication.test.mjs
        working-directory: Routeables.SignalR

  # The web samples draw the view models of the sample server (samples/Server): their types and their builds are checked here, then each one is
  # driven in Chrome against the real server (tests/samples/smoke.mjs). Vue and React are served as built (vite preview); Angular by its
  # development server, which proxies the hub as in development.
  web-samples:
    name: Web sample (${{ matrix.sample.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample:
          - { name: Angular, path: samples/Angular/XAnimals.Angular, port: 4200, serve: 'npx ng serve --port 4200' }
          - { name: Vue, path: samples/Vue/XAnimals.Vue, port: 5173, serve: 'npx vite preview --port 5173 --strictPort' }
          - { name: React, path: samples/React/XAnimals.React, port: 5174, serve: 'npx vite preview --port 5174 --strictPort' }

    steps:
      - name: Checkout Routeables.SignalR
        uses: actions/checkout@v7
        with:
          path: Routeables.SignalR

      - name: Checkout Routeables
        uses: actions/checkout@v7
        with:
          repository: cedric56/Routeables
          ref: ${{ env.ROUTEABLES_REF }}
          path: Routeables

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: Routeables.SignalR/${{ matrix.sample.path }}

      - name: Build
        run: npm run build
        working-directory: Routeables.SignalR/${{ matrix.sample.path }}

      - name: Start the server and the app
        run: |
          dotnet build samples/Server -c Release
          nohup dotnet samples/Server/bin/Release/net10.0/XAnimals.Server.dll > "$RUNNER_TEMP/server.log" 2>&1 &
          (cd ${{ matrix.sample.path }} && nohup ${{ matrix.sample.serve }} > "$RUNNER_TEMP/app.log" 2>&1 &)
          for i in $(seq 120); do curl -sf http://localhost:5090/routeables/negotiate?negotiateVersion=1 -X POST > /dev/null && curl -sf http://localhost:${{ matrix.sample.port }} > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/app.log"; exit 1
        working-directory: Routeables.SignalR

      - name: Drive it in Chrome
        run: npm ci --no-audit --no-fund && node smoke.mjs http://localhost:${{ matrix.sample.port }}
        working-directory: Routeables.SignalR/tests/samples
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # The Dart client and the Flutter sample: analysed and tested by Flutter, and the sample built for the web.
  flutter:
    name: Dart client and Flutter sample
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A release line, not the moving stable channel: a new Flutter never breaks this build by surprise. Move it on purpose.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Client
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
        working-directory: clients/dart

      - name: Sample
        run: |
          flutter pub get
          dart run tool/setup.dart
          flutter analyze --no-fatal-infos
          flutter test
          flutter build web
        working-directory: samples/Flutter/xanimals_flutter
