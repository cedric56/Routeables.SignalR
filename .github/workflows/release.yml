name: Release

# A tag v2.1.0 publishes Routeables.SignalR and Routeables.Remote 2.1.0 to NuGet and @routeables/client 2.1.0 to npm: the two packages always share their version
# (see VERSIONING.md). The NuGet package depends on the published packages of Routeables (vars.ROUTEABLES_VERSION), not on its sources.
#
# Needs: the secret NUGET_API_KEY, the secret NPM_TOKEN, and the variable ROUTEABLES_VERSION (the version of the Routeables packages).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write   # npm provenance

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The tag must name the version the sources say: v2.1.0 or v2.1.0-beta.1 for VersionPrefix 2.1.0 and package.json 2.1.0.
      - name: The tag matches the version of the sources
        run: |
          tag="${{ steps.version.outputs.value }}"
          prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          npm=$(node -p "require('./clients/typescript/package.json').version")
          echo "tag $tag, VersionPrefix $prefix, package.json $npm"
          [ "${tag%%-*}" = "$prefix" ] || { echo "::error::The tag $tag does not match VersionPrefix $prefix (Directory.Build.props)."; exit 1; }
          [ "${tag%%-*}" = "${npm%%-*}" ] || { echo "::error::The tag $tag does not match the version of @routeables/client ($npm)."; exit 1; }

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The tests of the server, against the published packages of Routeables that the package will depend on: what passed in the CI against
      # the pinned sources of Routeables must pass against them too, or nothing is published.
      - name: Test the server against the packages of Routeables
        run: dotnet test tests/Routeables.SignalR.Test -c Release -p:RouteablesVersion=${{ vars.ROUTEABLES_VERSION }}

      - name: Test the remote protocol
        run: dotnet test tests/Routeables.Remote.Test -c Release

      # Routeables.Remote has no dependency; Routeables.SignalR depends on it at the same version.
      - name: Pack Routeables.Remote and Routeables.SignalR against the packages of Routeables
        run: |
          dotnet pack src/Routeables.Remote/Routeables.Remote.csproj -c Release -o artifacts -p:Version=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true
          dotnet pack src/Routeables.SignalR/Routeables.SignalR.csproj -c Release -o artifacts \
            -p:RouteablesVersion=${{ vars.ROUTEABLES_VERSION }} -p:Version=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true
          dotnet pack src/Routeables.SignalR.Essentials/Routeables.SignalR.Essentials.csproj -c Release -o artifacts \
            -p:RouteablesVersion=${{ vars.ROUTEABLES_VERSION }} -p:Version=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true

      # The package as an application gets it: from a feed, in an empty project, with nothing of this repository around it.
      - name: Install the NuGet package
        run: |
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          dotnet new web --framework net10.0 --name Consumer --output . > /dev/null
          dotnet add package Routeables.SignalR --version ${{ steps.version.outputs.value }} --source "$GITHUB_WORKSPACE/artifacts" --source https://api.nuget.org/v3/index.json
          dotnet build -c Release

      - name: Test the TypeScript client
        run: npm ci --no-audit --no-fund && npm test
        working-directory: clients/typescript

      - name: Version the TypeScript client
        run: npm version ${{ steps.version.outputs.value }} --no-git-tag-version --allow-same-version
        working-directory: clients/typescript

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: clients/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
