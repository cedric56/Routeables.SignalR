<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counter</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <h1>Count: <span id="count">…</span></h1>
  <p>
    <label>Step <input id="step" type="number" min="1" value="1"></label>
    <button id="increment" type="button">Add</button>
    <button id="reset" type="button">Reset</button>
  </p>
  <p id="error" role="alert"></p>

  <!-- The page talks to the server with SignalR alone. A real application uses @routeables/client (clients/typescript). -->
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.0/dist/browser/signalr.min.js"></script>
  <script>
    const connection = new signalR.HubConnectionBuilder().withUrl('/routeables').withAutomaticReconnect().build();
    const el = id => document.getElementById(id);
    const show = state => { el('count').textContent = state.count; el('step').value = state.step; };
    let page = null;   // the state of the page, its generation and its last version

    connection.on('Navigated', message => {
      page = { generation: message.generation, version: 0, state: message.state };
      show(page.state);
    });
    connection.on('Changed', message => {
      if (page === null || message.generation !== page.generation) return;   // a change of an older page
      if (message.version !== page.version + 1) { connection.invoke('Resync', ''); return; }   // one was lost: ask the state again
      page.version = message.version;
      for (const patch of message.patches) if (patch.op === 'set' && patch.path.length === 1) page.state[patch.path[0]] = patch.value;
      show(page.state);
    });
    connection.on('Failed', failure => { el('error').textContent = failure.message; });
    connection.on('Completed', () => {});

    el('increment').onclick = () => connection.invoke('Set', 'step', Number(el('step').value))
      .then(() => connection.invoke('Invoke', 'increment', []));
    el('reset').onclick = () => connection.invoke('Invoke', 'reset', []);

    connection.start()
      .then(() => connection.invoke('Hello', { protocol: 2 }))
      .then(() => connection.invoke('GoTo', '/counter'));
  </script>
</body>
</html>
